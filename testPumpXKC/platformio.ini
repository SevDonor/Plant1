; PlatformIO Project Configuration File
; Project: ESP32-S3 Test Bom Mini 5V & Cam bien Muc nuoc XKC-Y25-V
; So do chan mac dinh khop 100% voi D:\Plant\main.fzz:
;   - Cam bien XKC-Y25-V (M1):
;       * M1.pin1 (VCC)  -> 5V (Mini560 A2.pin9)
;       * M1.pin4 (MODE) -> 5V (Mini560 A2.pin9)
;       * M1.pin3 (GND)  -> GND (Mini560 A2.pin6)
;       * M1.pin2 (OUT)  -> R3 (220 Ohm) -> Opto PC817 (U5) LED Anode
;       * U5 Collector   -> ESP32-S3 Pin 7 (GPIO 7) + R4 (10k Ohm pull-up 3V3)
;       * U5 Emitter     -> GND
;       => Luu y: PC817 U5 dao muc tin hieu (XKC OUT HIGH => GPIO 7 LOW).
;   - Bom Mini 5V (WATER PUMP1):
;       * ESP32-S3 Pin 20 (GPIO 14) -> R1 (220 Ohm) -> Opto PC817 (U4) LED Anode
;       * U4 Collector   -> 5V (Mini560 A2.pin8)
;       * U4 Emitter     -> MOSFET Q1 Gate + R2 (10k Ohm pull-down GND)
;       * Q1 Drain       -> WATER PUMP1 (-) + Diode 1N4001 (D1)
;       * Q1 Source      -> GND
;       * WATER PUMP1 (+)-> 5V (Mini560 A2.pin9) + Diode 1N4001 (D1)
;       => Logic: GPIO 14 HIGH => U4 dan => Q1 dan => BOM CHAY (Active-HIGH).

[platformio]
default_envs = esp32_30pin

; ============================================================================
; Tam dung cho ESP32 thuong 30 chan (ESP32-WROOM-32 / DevKit V1)
;   - XKC-Y25-V (qua PC817 U5): GPIO 27 (D27)
;   - Bom 5V (qua PC817 U4 + Q1): GPIO 26 (D26)
; ============================================================================
[env:esp32_30pin]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D XKC_SENSOR_PIN=27
    -D PUMP_CTRL_PIN=26

[env:esp32s3_usb_cdc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D XKC_SENSOR_PIN=7
    -D PUMP_CTRL_PIN=14

[env:esp32s3_uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D XKC_SENSOR_PIN=7
    -D PUMP_CTRL_PIN=14

; ============================================================================
; PLATFORMIO CONFIGURATION - BỘ TEST 3 NHÓM CẢM BIẾN (ESP32)
; ============================================================================
; Bạn có thể chọn Environment cần nạp ở thanh trạng thái dưới cùng của VS Code:
;   - env:group1_env     -> Nhóm 1: BH1750 + AHT20 + BMP280 + Độ ẩm đất
;   - env:group2_mpu6050 -> Nhóm 2: MPU-6050 (Có sẵn chế độ hiệu chỉnh lưu Flash)
;   - env:group3_inmp441 -> Nhóm 3: Micro I2S INMP441 (921600 baud + Thu âm STT)
;   - env:all_in_one     -> Firmware tổng hợp test chuyển đổi trực tiếp cả 3 nhóm
; ============================================================================

[platformio]
default_envs = all_in_one

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_filters = esp32_exception_decoder, colorize
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

[env:all_in_one]
monitor_speed = 921600
build_src_filter = +<main.cpp>

[env:group1_env]
monitor_speed = 115200
build_src_filter = -<*> +<../1_env_sensors/src/main.cpp>

[env:group2_mpu6050]
monitor_speed = 115200
build_src_filter = -<*> +<../2_mpu6050/src/main.cpp>

[env:group3_inmp441]
monitor_speed = 921600
build_src_filter = -<*> +<../3_mic_inmp441/src/main.cpp>

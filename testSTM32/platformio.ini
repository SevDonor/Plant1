; PlatformIO Project Configuration File
; Project: Firmware He Thong Giam Sat Moi Truong & Cham Soc Cay Trong Thong Minh (ESP32-S3 + AI Chatbot)
; Day du 6 Phan He theo Luu do Thuat toan & So do D:\Plant\main.fzz:
;   - Bus I2C 0 (SDA = GPIO 11, SCL = GPIO 12): MPU6050 (0x68, INT = GPIO 10) + OLED 1 (0x3C - Mat Trai)
;   - Bus I2C 1 (SDA = GPIO 1,  SCL = GPIO 2) : AHT20 (0x38) + BMP280 (0x76/0x77) + BH1750 (0x23/0x5C) + OLED 2 (0x3C - Mat Phai)
;   - Micro I2S INMP441 (I2S_NUM_0 RX)        : WS = GPIO 4, SCK = GPIO 5, SD = GPIO 6
;   - Loa I2S MAX98357A (I2S_NUM_1 TX)        : BCLK = GPIO 15, LRCLK = GPIO 16, DIN = GPIO 17, SD_MODE = GPIO 18
;   - Cam bien Do am dat (ADC 12-bit)         : GPIO 3 (ADC1_CH2)
;   - Cam bien Muc nuoc binh chua (XKC-Y25)   : GPIO 7
;   - Dieu khien Bom mini 5V (PC817 + MOSFET) : GPIO 14

[platformio]
default_envs = esp32s3_usb_cdc

; ============================================================================
; Moi truong 1 (Mac dinh): Cam cap vao cong USB (OTG / Native USB) tren ESP32-S3
; ============================================================================
[env:esp32s3_usb_cdc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D I2C_SDA_PIN=11
    -D I2C_SCL_PIN=12
    -D OLED2_SDA_PIN=1
    -D OLED2_SCL_PIN=2
    -D MPU_INT_PIN=10
    -D MIC_WS_PIN=4
    -D MIC_SCK_PIN=5
    -D MIC_SD_PIN=6
    -D SOIL_ADC_PIN=3
    -D WATER_LEVEL_PIN=7
    -D PUMP_RELAY_PIN=14
    -D SPK_BCLK_PIN=15
    -D SPK_LRCLK_PIN=16
    -D SPK_DIN_PIN=17
    -D SPK_SD_PIN=18

; ============================================================================
; Moi truong 2: Cam cap vao cong UART (COM / CH340 / CP2102) tren ESP32-S3
; ============================================================================
[env:esp32s3_uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D I2C_SDA_PIN=11
    -D I2C_SCL_PIN=12
    -D OLED2_SDA_PIN=1
    -D OLED2_SCL_PIN=2
    -D MPU_INT_PIN=10
    -D MIC_WS_PIN=4
    -D MIC_SCK_PIN=5
    -D MIC_SD_PIN=6
    -D SOIL_ADC_PIN=3
    -D WATER_LEVEL_PIN=7
    -D PUMP_RELAY_PIN=14
    -D SPK_BCLK_PIN=15
    -D SPK_LRCLK_PIN=16
    -D SPK_DIN_PIN=17
    -D SPK_SD_PIN=18

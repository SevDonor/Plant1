; PlatformIO Project Configuration File
; Project: Test MPU6050 ket noi ESP32-S3 + Python UI theo doi trang thai

[platformio]
default_envs = esp32s3_usb_cdc

; ============================================================================
; Moi truong 1 (Mac dinh): Cam cap vao cong USB (OTG / Native USB) tren ESP32-S3
; Dung cho hau het cac mach ESP32-S3-DevKitC-1 (cong USB), ESP32-S3 SuperMini/Zero
; ============================================================================
[env:esp32s3_usb_cdc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D I2C_SDA_PIN=8
    -D I2C_SCL_PIN=9
    -D MPU_INT_PIN=4


; PlatformIO Project Configuration File
; Project: ESP32-S3 MAX98357A Pulse Generator & Hardware Multimeter Probe Firmware
; So do chan mac dinh khop 100% D:\Plant\main.fzz:
;   - MAX98357A LRC (LRCLK)  -> ESP32-S3 Pin 8  (GPIO 15)
;   - MAX98357A BCLK         -> ESP32-S3 Pin 9  (GPIO 16)
;   - MAX98357A DIN          -> ESP32-S3 Pin 10 (GPIO 17)
;   - MAX98357A SD_MODE (SD) -> ESP32-S3 Pin 11 (GPIO 18)
;   - MAX98357A GAIN         -> GND (12 dB)
;   - MAX98357A VIN / GND    -> 5V / GND

[platformio]
default_envs = esp32s3_usb_cdc

[env:esp32s3_usb_cdc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SPK_LRCLK_PIN=15
    -D SPK_BCLK_PIN=16
    -D SPK_DIN_PIN=17
    -D SPK_SD_PIN=18

[env:esp32s3_uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D SPK_LRCLK_PIN=15
    -D SPK_BCLK_PIN=16
    -D SPK_DIN_PIN=17
    -D SPK_SD_PIN=18
